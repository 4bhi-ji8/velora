
<div class="min-h-screen flex items-center justify-center bg-[#F5F2EE] px-4 py-10 sm:py-14">

  <div class="w-full max-w-md rounded-2xl border border-black/10 bg-white p-6 shadow-sm sm:p-8">

    <!-- Brand -->
    <div class="mb-8 text-center">
      <a routerLink="/register"
         class="inline-block text-3xl font-extrabold italic tracking-tight text-black">
        VELORA
      </a>

      <p class="mt-1 text-xs uppercase tracking-[0.25em] text-gray-500">
        Modern essentials
      </p>

      <h1 class="mt-7 text-2xl font-bold tracking-tight text-black">
        Welcome back
      </h1>

      <p class="mt-2 text-sm text-gray-500">
        Sign in to continue your style journey.
      </p>
    </div>

    <!-- Error message -->
    <p *ngIf="errorMessage()"
       class="mb-5 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-600">
      {{ errorMessage() }}
    </p>

    <!-- Login form -->
    <form (ngSubmit)="login()" #loginForm="ngForm" class="space-y-5">

      <!-- Email -->
      <div>
        <label for="email"
               class="mb-2 block text-sm font-medium text-gray-800">
          Email address
        </label>

        <input
          id="email"
          type="email"
          name="email"
          placeholder="you@example.com"
          [(ngModel)]="email"
          required
          email
          #emailInput="ngModel"
          class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-sm text-black placeholder-gray-400 outline-none transition focus:border-black focus:ring-1 focus:ring-black"
        />

        <p *ngIf="emailInput.invalid && emailInput.touched"
           class="mt-2 text-sm text-red-600">
          <span *ngIf="emailInput.errors?.['required']">
            Email is required.
          </span>
          <span *ngIf="emailInput.errors?.['email']">
            Please enter a valid email address.
          </span>
        </p>
      </div>

      <!-- Password -->
      <div>
        <label for="password"
               class="mb-2 block text-sm font-medium text-gray-800">
          Password
        </label>

        <div class="flex items-center gap-2 rounded-lg border border-gray-300 bg-white pr-4 transition focus-within:border-black focus-within:ring-1 focus-within:ring-black">

          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            placeholder="Enter your password"
            [(ngModel)]="password"
            required
            #passwordInput="ngModel"
            class="min-w-0 flex-1 bg-transparent px-4 py-3 text-sm text-black outline-none placeholder-gray-400"
          />

          <button
            type="button"
            (click)="showPassword = !showPassword"
            class="shrink-0 text-xs font-semibold text-gray-600 transition hover:text-black"
          >
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>

        <p *ngIf="passwordInput.invalid && passwordInput.touched"
           class="mt-2 text-sm text-red-600">
          <span *ngIf="passwordInput.errors?.['required']">
            Password is required.
          </span>
        </p>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        [disabled]="!loginForm.valid"
        class="w-full rounded-lg bg-black px-4 py-3.5 text-sm font-semibold text-white transition hover:bg-gray-800 disabled:cursor-not-allowed disabled:opacity-40"
      >
        Sign in
      </button>

    </form>

    <!-- Register link -->
    <p class="mt-7 text-center text-sm text-gray-600">
      Don't have an account?
      <a routerLink="/register"
         class="font-semibold text-black underline underline-offset-4 transition hover:text-gray-500">
        Create an account
      </a>
    </p>

    <!-- Footer -->
    <p class="mt-8 border-t border-gray-100 pt-5 text-center text-xs text-gray-400">
      Welcome to Velora.
    </p>

  </div>
</div>
